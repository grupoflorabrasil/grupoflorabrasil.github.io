<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso — Avaliação</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#12140f;
  --verde:#007038;
  --azul:#0f1e9b;
  --paper:#f5f1e2;
  --mist:#a3ab9c;
  --text-on-paper:#1c2418;
  --text-muted-on-paper:#6b6355;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  padding:40px 24px 80px;
}
.wrap{ width:100%; max-width:1040px; margin:0 auto; }

.page-header{
  text-align:center;
  margin-bottom:36px;
  padding-bottom:24px;
  border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg, var(--verde), var(--azul)) 1;
}
.page-header h1{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:30px;
  margin:0;
  letter-spacing:-0.5px;
}
.page-header .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--mist);
  margin-top:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
  gap:18px;
}
.card{
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  overflow:hidden;
}
.card .foto{
  width:100%;
  aspect-ratio:3/4;
  background:#0000 center/cover no-repeat, var(--paper);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-muted-on-paper);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
}
.card .codigo{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:13px;
  letter-spacing:0.5px;
  text-align:center;
  padding:12px 12px 8px;
  border-top:1px solid rgba(28,36,24,0.12);
}
.card .nota-area{
  padding:0 12px 14px;
  display:flex;
  gap:8px;
}
.card .nota-area input{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:8px 10px;
  border-radius:6px;
  border:1px solid rgba(28,36,24,0.2);
  text-align:center;
}
.card .nota-area button{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  background:var(--verde);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:0 12px;
  cursor:pointer;
  white-space:nowrap;
}
.card .nota-area button:hover{ opacity:0.9; }
.card .nota-status{
  padding:0 12px 12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--text-muted-on-paper);
  min-height:14px;
}

.seletor-jurado{
  max-width:420px;
  margin:0 auto 32px;
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  padding:18px 20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  text-align:center;
}
.seletor-jurado label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-muted-on-paper);
  margin-bottom:10px;
}
.seletor-jurado select{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:15px;
  padding:10px 12px;
  border-radius:6px;
  border:1px solid rgba(28,36,24,0.2);
  background:#fff;
}
.grid.travado{ opacity:0.35; pointer-events:none; }

.estado{
  text-align:center;
  padding:60px 20px;
  color:var(--mist);
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
}

.lightbox{
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,0.9);
  align-items:center;
  justify-content:center;
  z-index:1000;
  cursor:zoom-out;
  padding:24px;
}
.lightbox.aberto{ display:flex; }
.lightbox img{ max-width:90vw; max-height:90vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.6); }
.card .foto{ cursor:zoom-in; }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-header">
    <h1 id="titulo-concurso">Concurso — Avaliação</h1>
    <div class="sub">Avalie cada participante pelo código · Grupo Flora Brasil</div>
  </div>

  <div class="seletor-jurado">
    <label>Quem está avaliando?</label>
    <select id="select-jurado">
      <option value="">Selecione...</option>
      <option>Jurado 1</option>
      <option>Jurado 2</option>
      <option>Jurado 3</option>
      <option>Jurado 4</option>
    </select>
  </div>

  <div id="grid" class="grid travado"></div>
  <div id="estado" class="estado">Carregando fotos…</div>
</div>

<div id="lightbox" class="lightbox" onclick="fecharLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  // Mesma URL do Web App usada em Code.gs
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZwiWg-lCFtCS1komzwk_8fQWflGzTZFA21xo6Ybjvg1Fr2gaTyeVhdm0FelIFQ7_e/exec';

  const params = new URLSearchParams(window.location.search);
  const CONCURSO = params.get('concurso');

  if (CONCURSO) {
    document.getElementById('titulo-concurso').textContent = 'Concurso — ' + CONCURSO;
  }

  function abrirLightbox(url) {
    if (!url) return;
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('aberto');
  }
  function fecharLightbox() {
    document.getElementById('lightbox').classList.remove('aberto');
  }

  async function carregar() {
    const estado = document.getElementById('estado');
    const grid = document.getElementById('grid');

    if (!CONCURSO) {
      estado.textContent = 'Link incompleto — falta indicar qual concurso (parâmetro ?concurso= na URL).';
      return;
    }

    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?action=banca&concurso=${encodeURIComponent(CONCURSO)}`);
      const dados = await resp.json();

      if (!Array.isArray(dados) || dados.length === 0) {
        estado.textContent = 'Nenhuma foto cadastrada ainda.';
        return;
      }

      estado.style.display = 'none';
      grid.innerHTML = dados.map(item => `
        <div class="card">
          <div class="foto" style="${item.foto ? `background-image:url('${item.foto}')` : ''}" onclick="abrirLightbox('${item.foto || ''}')">
            ${item.foto ? '' : 'sem foto'}
          </div>
          <div class="codigo">${item.codigo}</div>
          <div class="nota-area">
            <input type="number" min="0" max="10" step="0.5" placeholder="Nota 0-10" data-codigo="${item.codigo}">
            <button onclick="salvarNota('${item.codigo}', this)">Salvar</button>
          </div>
          <div class="nota-status" data-status="${item.codigo}"></div>
        </div>
      `).join('');
    } catch (err) {
      estado.textContent = 'Não foi possível carregar as fotos agora.';
      console.error(err);
    }
  }

  async function salvarNota(codigo, botao) {
    const jurado = document.getElementById('select-jurado').value;
    const input = document.querySelector(`input[data-codigo="${codigo}"]`);
    const status = document.querySelector(`[data-status="${codigo}"]`);
    const nota = input.value;

    if (!jurado) {
      status.textContent = 'Selecione o jurado primeiro.';
      return;
    }
    if (nota === '' || Number(nota) < 0 || Number(nota) > 10) {
      status.textContent = 'Nota precisa ser entre 0 e 10.';
      return;
    }

    botao.disabled = true;
    status.textContent = 'Salvando…';

    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ tipo: 'nota', concurso: CONCURSO, codigo, jurado, nota: Number(nota) })
      });
      const resultado = await resp.json();

      if (resultado.erro) {
        status.textContent = 'Erro: ' + resultado.erro;
        botao.disabled = false;
        return;
      }
      status.textContent = 'Nota salva!';
      botao.disabled = false;
    } catch (err) {
      status.textContent = 'Não foi possível salvar agora.';
      botao.disabled = false;
      console.error(err);
    }
  }

  document.getElementById('select-jurado').addEventListener('change', function () {
    const grid = document.getElementById('grid');
    if (this.value) {
      grid.classList.remove('travado');
    } else {
      grid.classList.add('travado');
    }
  });

  carregar();
</script>
</body>
</html>
