<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso — Painel Grupo Flora Brasil</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#12140f;
  --verde:#007038;
  --azul:#0f1e9b;
  --paper:#f5f1e2;
  --paper-dim:#e9e0c9;
  --mist:#a3ab9c;
  --text-on-paper:#1c2418;
  --text-muted-on-paper:#6b6355;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  padding:40px 24px 80px;
}
.wrap{ width:100%; max-width:1080px; margin:0 auto; }

.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.voltar{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--mist);
  text-decoration:none;
  border:1px solid rgba(245,241,226,0.2);
  padding:8px 14px;
  border-radius:6px;
}
.voltar:hover{ border-color: var(--paper); color: var(--paper); }

.page-header h1{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:34px;
  margin:0;
  letter-spacing:-0.5px;
}
.page-header .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--mist);
  margin-top:6px;
}

.tabs{
  display:flex;
  gap:28px;
  margin-top:28px;
  border-bottom:1px solid rgba(245,241,226,0.15);
}
.tab-btn{
  background:none;
  border:none;
  color:var(--mist);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.5px;
  padding:0 0 14px;
  cursor:pointer;
  position:relative;
}
.tab-btn.ativa{ color:var(--paper); }
.tab-btn.ativa::after{
  content:'';
  position:absolute;
  left:0; right:0; bottom:-1px;
  height:2px;
}
.tab-btn[data-tab="participantes"].ativa::after{ background:var(--verde); }
.tab-btn[data-tab="banca"].ativa::after{ background:var(--azul); }

.tab-conteudo{ display:none; padding-top:28px; }
.tab-conteudo.ativa{ display:block; }

.card{
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  overflow:hidden;
}
.form-card{
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  padding:22px 24px;
  margin-bottom:24px;
}
.form-card h2{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:19px;
  margin:0 0 16px;
}
#form-novo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
#form-novo input, #form-novo select{
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:10px 12px;
  border-radius:6px;
  border:1px solid rgba(28,36,24,0.2);
  background:#fff;
  color:var(--text-on-paper);
}
#form-novo input[type="file"]{ grid-column:1/-1; background:transparent; border:none; padding:4px 0; }
#form-novo button{
  grid-column:1/-1;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  background:var(--verde);
  color:#fff;
  border:none;
  padding:12px;
  border-radius:6px;
  cursor:pointer;
}
#form-novo button:hover{ opacity:0.9; }
#form-status{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  margin-top:10px;
  color:var(--text-muted-on-paper);
}

table{ width:100%; border-collapse:collapse; }
thead th{
  text-align:left;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-muted-on-paper);
  padding:14px 16px;
  border-bottom:1px solid rgba(28,36,24,0.15);
}
tbody td{
  padding:12px 16px;
  border-bottom:1px solid rgba(28,36,24,0.08);
  font-size:14px;
  vertical-align:middle;
}
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background: rgba(0,112,56,0.05); }
td img{ width:44px; height:56px; object-fit:cover; border-radius:4px; display:block; cursor:zoom-in; }

.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.3px;
  color:#fff;
}
.badge-flora{ background:var(--verde); }
.badge-esg{ background:var(--azul); }
.badge-outra{ background:#6b6355; }

.btn-excluir{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  text-transform:uppercase;
  background:transparent;
  color:#b3452f;
  border:1px solid #b3452f;
  border-radius:6px;
  padding:6px 10px;
  cursor:pointer;
  white-space:nowrap;
}
.btn-excluir:hover{ background:#b3452f; color:#fff; }

.estado{
  text-align:center;
  padding:60px 20px;
  color:var(--text-muted-on-paper);
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
}
.estado.erro{ color:#b3452f; }

.lightbox{
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  align-items:center;
  justify-content:center;
  z-index:1000;
  cursor:zoom-out;
  padding:24px;
}
.lightbox.aberto{ display:flex; }
.lightbox img{ max-width:90vw; max-height:90vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }

.seletor-jurado{
  max-width:420px;
  margin:0 0 28px;
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  padding:18px 20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
}
.seletor-jurado label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-muted-on-paper);
  margin-bottom:10px;
}
.seletor-jurado select{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:15px;
  padding:10px 12px;
  border-radius:6px;
  border:1px solid rgba(28,36,24,0.2);
  background:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
  gap:18px;
}
.grid.travado{ opacity:0.35; pointer-events:none; }
.foto-card{
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  overflow:hidden;
}
.foto-card .foto{
  width:100%;
  aspect-ratio:3/4;
  background:#0000 center/cover no-repeat, var(--paper);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-muted-on-paper);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  cursor:zoom-in;
}
.foto-card .codigo{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:13px;
  text-align:center;
  padding:12px 12px 8px;
  border-top:1px solid rgba(28,36,24,0.12);
}
.foto-card .nota-area{ padding:0 12px 14px; display:flex; gap:8px; }
.foto-card .nota-area input{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:8px 10px;
  border-radius:6px;
  border:1px solid rgba(28,36,24,0.2);
  text-align:center;
}
.foto-card .nota-area button{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  background:var(--azul);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:0 12px;
  cursor:pointer;
  white-space:nowrap;
}
.foto-card .nota-status{
  padding:0 12px 12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--text-muted-on-paper);
  min-height:14px;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <a class="voltar oculto-banca" href="index.html">← Voltar</a>
  </div>

  <div class="page-header">
    <h1>Concurso</h1>
    <div class="sub" id="subtitulo">carregando…</div>
  </div>

  <div class="tabs oculto-banca" id="tabs">
    <button class="tab-btn" data-tab="participantes" onclick="mudarTab('participantes')">PARTICIPANTES</button>
    <button class="tab-btn ativa" data-tab="banca" onclick="mudarTab('banca')">BANCA</button>
  </div>

  <div class="tab-conteudo" id="tab-participantes">
    <div class="form-card">
      <h2>Adicionar participante</h2>
      <form id="form-novo">
        <input required id="f-codigo" placeholder="Código (ex: C003)">
        <input required id="f-nome" placeholder="Nome do colaborador">
        <select required id="f-empresa">
          <option value="">Empresa</option>
          <option>Viveiro Flora Brasil</option>
          <option>Novo Ciclo</option>
          <option>Lótus Soluções Ambientais</option>
        </select>
        <input required id="f-telefone" placeholder="Telefone">
        <input id="f-foto" type="file" accept="image/*">
        <button type="submit">Salvar participante</button>
      </form>
      <p id="form-status"></p>
    </div>

    <div class="card">
      <table id="tabela" style="display:none;">
        <thead>
          <tr>
            <th>Foto</th><th>Código</th><th>Nome</th><th>Empresa</th><th>Telefone</th>
            <th>Dani</th><th>Natália</th><th>Renata</th><th>Victor</th><th>Total</th><th>Ação</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="estado-participantes" class="estado">Carregando…</div>
    </div>
  </div>

  <div class="tab-conteudo ativa" id="tab-banca">
    <div class="seletor-jurado">
      <label>Quem está avaliando?</label>
      <select id="select-jurado">
        <option value="">Selecione...</option>
        <option>Dani</option>
        <option>Natália</option>
        <option>Renata</option>
        <option>Victor</option>
      </select>
    </div>
    <div id="grid" class="grid travado"></div>
    <div id="estado-banca" class="estado">Carregando fotos…</div>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="fecharLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const MODO_BANCA = params.get('modo') === 'banca';

  // Mesma URL do Web App usada em Code.gs
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxR-Y-dd0Q381qFHOtm2AL1ZOg9UJw8g-N--_TIwHPq1fIW8t-3YOvjz445tscc_KT/exec';
  // Precisa bater com a propriedade SENHA_CONCURSO no Apps Script.
  const SENHA_ADMIN = '1996';

  if (MODO_BANCA) {
    // Link público pra banca — sem senha, sem aba Participantes visível.
    document.querySelectorAll('.oculto-banca').forEach(el => el.style.display = 'none');
    mudarTab('banca');
  } else {
    // Acesso normal (admin) — segue o mesmo padrão das outras páginas do painel.
    if (sessionStorage.getItem('acesso_concurso') !== 'ok') {
      window.location.href = 'index.html';
    }
  }

  function mudarTab(nome) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('ativa', b.dataset.tab === nome));
    document.querySelectorAll('.tab-conteudo').forEach(c => c.classList.toggle('ativa', c.id === 'tab-' + nome));
  }

  function badge(empresa) {
    if (!empresa) return '';
    const e = empresa.toLowerCase();
    let classe = 'badge-outra';
    if (e.includes('lótus') || e.includes('lotus')) classe = 'badge-flora';
    else if (e.includes('flora')) classe = 'badge-flora';
    else if (e.includes('novo ciclo') || e.includes('ciclo')) classe = 'badge-esg';
    return `<span class="badge ${classe}">${empresa}</span>`;
  }

  function abrirLightbox(url) {
    if (!url) return;
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('aberto');
  }
  function fecharLightbox() {
    document.getElementById('lightbox').classList.remove('aberto');
  }

  async function carregarParticipantes() {
    if (MODO_BANCA) return; // banca não carrega essa aba
    const estado = document.getElementById('estado-participantes');
    const tabela = document.getElementById('tabela');
    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?action=admin&senha=${encodeURIComponent(SENHA_ADMIN)}`);
      const dados = await resp.json();

      if (dados.erro) {
        estado.textContent = 'Não foi possível carregar os dados (' + dados.erro + ').';
        estado.classList.add('erro');
        return;
      }

      document.getElementById('subtitulo').textContent = dados.length + ' participante(s) cadastrado(s)';

      if (!Array.isArray(dados) || dados.length === 0) {
        estado.textContent = 'Nenhum participante cadastrado ainda.';
        tabela.style.display = 'none';
        estado.style.display = 'block';
        return;
      }

      document.getElementById('tbody').innerHTML = dados.map(row => `
        <tr>
          <td>${row.FotoURL ? `<img src="${row.FotoURL}" alt="${row['Código']}" onclick="abrirLightbox('${row.FotoURL}')">` : '—'}</td>
          <td>${row['Código'] || ''}</td>
          <td>${row['Nome'] || ''}</td>
          <td>${badge(row['Empresa'])}</td>
          <td>${row['Telefone'] || ''}</td>
          <td>${row['Nota_Dani'] !== '' && row['Nota_Dani'] !== undefined ? row['Nota_Dani'] : '—'}</td>
          <td>${row['Nota_Natália'] !== '' && row['Nota_Natália'] !== undefined ? row['Nota_Natália'] : '—'}</td>
          <td>${row['Nota_Renata'] !== '' && row['Nota_Renata'] !== undefined ? row['Nota_Renata'] : '—'}</td>
          <td>${row['Nota_Victor'] !== '' && row['Nota_Victor'] !== undefined ? row['Nota_Victor'] : '—'}</td>
          <td><strong>${row['NotaTotal'] !== '' && row['NotaTotal'] !== undefined ? row['NotaTotal'] : '—'}</strong></td>
          <td><button class="btn-excluir" onclick="excluirParticipante('${row['Código']}', '${(row['Nome'] || '').replace(/'/g, "\\'")}')">Excluir</button></td>
        </tr>
      `).join('');

      estado.style.display = 'none';
      tabela.style.display = 'table';
    } catch (err) {
      estado.textContent = 'Não foi possível carregar os dados agora.';
      estado.classList.add('erro');
      console.error(err);
    }
  }

  async function carregarBanca() {
    const estado = document.getElementById('estado-banca');
    const grid = document.getElementById('grid');
    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?action=banca`);
      const dados = await resp.json();

      if (!Array.isArray(dados) || dados.length === 0) {
        estado.textContent = 'Nenhuma foto cadastrada ainda.';
        return;
      }

      if (MODO_BANCA) {
        document.getElementById('subtitulo').textContent = dados.length + ' participante(s) pra avaliar';
      }

      estado.style.display = 'none';
      grid.innerHTML = dados.map(item => `
        <div class="foto-card">
          <div class="foto" style="${item.foto ? `background-image:url('${item.foto}')` : ''}" onclick="abrirLightbox('${item.foto || ''}')">
            ${item.foto ? '' : 'sem foto'}
          </div>
          <div class="codigo">${item.codigo}</div>
          <div class="nota-area">
            <input type="number" min="0" max="10" step="0.5" placeholder="Nota 0-10" data-codigo="${item.codigo}">
            <button onclick="salvarNota('${item.codigo}', this)">Salvar</button>
          </div>
          <div class="nota-status" data-status="${item.codigo}"></div>
        </div>
      `).join('');
    } catch (err) {
      estado.textContent = 'Não foi possível carregar as fotos agora.';
      console.error(err);
    }
  }

  async function salvarNota(codigo, botao) {
    const jurado = document.getElementById('select-jurado').value;
    const input = document.querySelector(`input[data-codigo="${codigo}"]`);
    const status = document.querySelector(`[data-status="${codigo}"]`);
    const nota = input.value;

    if (!jurado) {
      status.textContent = 'Selecione o jurado primeiro.';
      return;
    }
    if (nota === '' || Number(nota) < 0 || Number(nota) > 10) {
      status.textContent = 'Nota precisa ser entre 0 e 10.';
      return;
    }

    botao.disabled = true;
    status.textContent = 'Salvando…';

    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ tipo: 'nota', codigo, jurado, nota: Number(nota) })
      });
      const resultado = await resp.json();

      if (resultado.erro) {
        status.textContent = 'Erro: ' + resultado.erro;
        botao.disabled = false;
        return;
      }
      status.textContent = 'Nota salva!';
      botao.disabled = false;
    } catch (err) {
      status.textContent = 'Não foi possível salvar agora.';
      botao.disabled = false;
      console.error(err);
    }
  }

  document.getElementById('select-jurado').addEventListener('change', function () {
    const grid = document.getElementById('grid');
    if (this.value) grid.classList.remove('travado');
    else grid.classList.add('travado');
  });

  function lerComoBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('form-novo').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const status = document.getElementById('form-status');
    const botao = ev.target.querySelector('button');
    const arquivo = document.getElementById('f-foto').files[0];

    botao.disabled = true;
    status.textContent = 'Enviando…';

    try {
      const fotoBase64 = arquivo ? await lerComoBase64(arquivo) : null;

      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          senha: SENHA_ADMIN,
          codigo: document.getElementById('f-codigo').value,
          nome: document.getElementById('f-nome').value,
          empresa: document.getElementById('f-empresa').value,
          telefone: document.getElementById('f-telefone').value,
          fotoBase64,
          fotoNomeArquivo: arquivo ? arquivo.name : null
        })
      });
      const resultado = await resp.json();

      if (resultado.erro) {
        status.textContent = 'Erro: ' + resultado.erro;
        botao.disabled = false;
        return;
      }

      status.textContent = 'Participante adicionado!';
      ev.target.reset();
      botao.disabled = false;
      carregarParticipantes();
      carregarBanca();
    } catch (err) {
      status.textContent = 'Não foi possível enviar agora.';
      botao.disabled = false;
      console.error(err);
    }
  });

  async function excluirParticipante(codigo, nome) {
    if (!confirm(`Excluir ${nome} (${codigo})? Essa ação não pode ser desfeita.`)) return;

    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ tipo: 'excluir', senha: SENHA_ADMIN, codigo })
      });
      const resultado = await resp.json();

      if (resultado.erro) {
        alert('Erro: ' + resultado.erro);
        return;
      }
      carregarParticipantes();
      carregarBanca();
    } catch (err) {
      alert('Não foi possível excluir agora.');
      console.error(err);
    }
  }

  carregarParticipantes();
  carregarBanca();
</script>
</body>
</html>
