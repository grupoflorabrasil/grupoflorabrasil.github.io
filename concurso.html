<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso — Painel Grupo Flora Brasil</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#12140f;
  --ink-soft:#1a1d16;
  --verde:#007038;
  --azul:#0f1e9b;
  --paper:#f5f1e2;
  --paper-dim:#e9e0c9;
  --mist:#a3ab9c;
  --text-on-paper:#1c2418;
  --text-muted-on-paper:#6b6355;
  --line:rgba(245,241,226,0.12);
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  padding:40px 24px 80px;
}
.wrap{
  width:100%;
  max-width:1040px;
  margin:0 auto;
}
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}
.voltar{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--mist);
  text-decoration:none;
  border:1px solid rgba(245,241,226,0.2);
  padding:8px 14px;
  border-radius:6px;
}
.voltar:hover{ border-color: var(--paper); color: var(--paper); }

.page-header{
  text-align:center;
  margin-bottom:36px;
  padding-bottom:24px;
  border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg, var(--verde), var(--azul)) 1;
}
.page-header h1{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:30px;
  margin:0;
  letter-spacing:-0.5px;
}
.page-header .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--mist);
  margin-top:8px;
}

.card{
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  overflow:hidden;
}

table{ width:100%; border-collapse:collapse; }
thead th{
  text-align:left;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-muted-on-paper);
  padding:14px 16px;
  border-bottom:1px solid rgba(28,36,24,0.15);
}
tbody td{
  padding:12px 16px;
  border-bottom:1px solid rgba(28,36,24,0.08);
  font-size:14px;
  vertical-align:middle;
}
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background: rgba(0,112,56,0.05); }

td img{
  width:44px; height:56px; object-fit:cover; border-radius:4px; display:block;
}
.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.3px;
  color:#fff;
}
.badge-flora{ background:var(--verde); }
.badge-esg{ background:var(--azul); }
.badge-outra{ background:#6b6355; }

.estado{
  text-align:center;
  padding:60px 20px;
  color:var(--text-muted-on-paper);
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
}
.estado.erro{ color:#b3452f; }

.form-card{
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  padding:22px 24px;
  margin-bottom:24px;
}
.form-card h2{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:19px;
  margin:0 0 16px;
}
#form-novo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
#form-novo input, #form-novo select{
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:10px 12px;
  border-radius:6px;
  border:1px solid rgba(28,36,24,0.2);
  background:#fff;
  color:var(--text-on-paper);
}
#form-novo input[type="file"]{ grid-column:1/-1; background:transparent; border:none; padding:4px 0; }
#form-novo button{
  grid-column:1/-1;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  background:var(--verde);
  color:#fff;
  border:none;
  padding:12px;
  border-radius:6px;
  cursor:pointer;
}
#form-novo button:hover{ opacity:0.9; }
#form-status{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  margin-top:10px;
  color:var(--text-muted-on-paper);
}

.lightbox{
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  align-items:center;
  justify-content:center;
  z-index:1000;
  cursor:zoom-out;
  padding:24px;
}
.lightbox.aberto{ display:flex; }
.lightbox img{ max-width:90vw; max-height:90vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }
td img{ cursor:zoom-in; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <a class="voltar" href="index.html">← Voltar</a>
  </div>

  <div class="page-header">
    <h1>Concurso</h1>
    <div class="sub">Dados completos — acesso restrito</div>
  </div>

  <div class="form-card">
    <h2>Adicionar participante</h2>
    <form id="form-novo">
      <input required id="f-codigo" placeholder="Código (ex: C003)">
      <input required id="f-nome" placeholder="Nome do colaborador">
      <select required id="f-empresa">
        <option value="">Empresa</option>
        <option>Viveiro Flora Brasil</option>
        <option>Novo Ciclo</option>
        <option>Lótus Soluções Ambientais</option>
      </select>
      <input required id="f-telefone" placeholder="Telefone">
      <input id="f-foto" type="file" accept="image/*">
      <button type="submit">Salvar participante</button>
    </form>
    <p id="form-status"></p>
  </div>

  <div class="card">
    <table id="tabela" style="display:none;">
      <thead>
        <tr>
          <th>Foto</th><th>Código</th><th>Nome</th><th>Empresa</th><th>Telefone</th><th>Nota da banca</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="estado" class="estado">Carregando…</div>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="fecharLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  // Guarda de acesso — segue o mesmo padrão das outras páginas do painel
  if (sessionStorage.getItem('acesso_concurso') !== 'ok') {
    window.location.href = 'index.html';
  }

  // Mesma URL do Web App usada em Code.gs
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJEZOkw4cFLEVNpWfbHy94RjLUC2bSXBQe1-2iXzSkSgDTKKzfRup07jIhm05OOugY/exec';
  // Precisa bater com a propriedade SENHA_CONCURSO no Apps Script.
  // A proteção real já é o backend (só devolve os dados com essa senha);
  // isso evita pedir senha duas vezes já que o card no index.html já pediu.
  const SENHA_ADMIN = '1996';

  function badge(empresa) {
    if (!empresa) return '';
    const e = empresa.toLowerCase();
    let classe = 'badge-outra';
    if (e.includes('lótus') || e.includes('lotus')) classe = 'badge-flora';
    else if (e.includes('flora')) classe = 'badge-flora';
    else if (e.includes('novo ciclo') || e.includes('ciclo')) classe = 'badge-esg';
    return `<span class="badge ${classe}">${empresa}</span>`;
  }

  function abrirLightbox(url) {
    if (!url) return;
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('aberto');
  }
  function fecharLightbox() {
    document.getElementById('lightbox').classList.remove('aberto');
  }

  async function carregar() {
    const estado = document.getElementById('estado');
    const tabela = document.getElementById('tabela');
    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?action=admin&senha=${encodeURIComponent(SENHA_ADMIN)}`);
      const dados = await resp.json();

      if (dados.erro) {
        estado.textContent = 'Não foi possível carregar os dados (senha do script incorreta).';
        estado.classList.add('erro');
        return;
      }
      if (!Array.isArray(dados) || dados.length === 0) {
        estado.textContent = 'Nenhum participante cadastrado ainda.';
        tabela.style.display = 'none';
        estado.style.display = 'block';
        return;
      }

      document.getElementById('tbody').innerHTML = dados.map(row => `
        <tr>
          <td>${row.FotoURL ? `<img src="${row.FotoURL}" alt="${row['Código']}" onclick="abrirLightbox('${row.FotoURL}')">` : '—'}</td>
          <td>${row['Código'] || ''}</td>
          <td>${row['Nome'] || ''}</td>
          <td>${badge(row['Empresa'])}</td>
          <td>${row['Telefone'] || ''}</td>
          <td>${row['Nota da Banca'] || '—'}</td>
        </tr>
      `).join('');

      estado.style.display = 'none';
      tabela.style.display = 'table';
    } catch (err) {
      estado.textContent = 'Não foi possível carregar os dados agora.';
      estado.classList.add('erro');
      console.error(err);
    }
  }

  function lerComoBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('form-novo').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const status = document.getElementById('form-status');
    const botao = ev.target.querySelector('button');
    const arquivo = document.getElementById('f-foto').files[0];

    botao.disabled = true;
    status.textContent = 'Enviando…';

    try {
      const fotoBase64 = arquivo ? await lerComoBase64(arquivo) : null;

      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          senha: SENHA_ADMIN,
          codigo: document.getElementById('f-codigo').value,
          nome: document.getElementById('f-nome').value,
          empresa: document.getElementById('f-empresa').value,
          telefone: document.getElementById('f-telefone').value,
          fotoBase64,
          fotoNomeArquivo: arquivo ? arquivo.name : null
        })
      });
      const resultado = await resp.json();

      if (resultado.erro) {
        status.textContent = 'Erro: ' + resultado.erro;
        botao.disabled = false;
        return;
      }

      status.textContent = 'Participante adicionado!';
      ev.target.reset();
      botao.disabled = false;
      carregar();
    } catch (err) {
      status.textContent = 'Não foi possível enviar agora.';
      botao.disabled = false;
      console.error(err);
    }
  });

  carregar();
</script>
</body>
</html>
