<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel de RH</title>
<style>
  :root{
    --bg: #15141b;
    --bg-elev: #1c1b24;
    --bg-elev-2: #24232f;
    --line: #322f3d;
    --text: #f1eef7;
    --text-dim: #9c96ad;
    --accent: #e0a63c;
    --accent-dim: #4a3a1e;
    --good: #5fb787;
    --warn: #e0a63c;
    --bad: #d9695f;

    --c-motorista: #5a8fd6;
    --c-motorista-bg: #1c2a3d;
    --c-operador: #e0a63c;
    --c-operador-bg: #3a2f1a;
    --c-administrativo: #a879d1;
    --c-administrativo-bg: #2b2038;
    --c-outros: #5fb7a8;
    --c-outros-bg: #1a3330;

    --radius: 12px;
    --font-head: 'Segoe UI', system-ui, sans-serif;
    --font-body: system-ui, -apple-system, sans-serif;
    --font-mono: 'Consolas', monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  /* ---------- LOGIN ---------- */
  #login-screen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 30% 20%, #211f2b, var(--bg));
    z-index: 100;
  }
  #login-box{
    background: var(--bg-elev); border:1px solid var(--line); border-radius: var(--radius);
    padding: 40px 36px; width: 320px; text-align:center;
  }
  #login-box h1{ font-family: var(--font-head); font-size: 22px; margin-bottom: 6px; letter-spacing: 0.3px;}
  #login-box p{ color: var(--text-dim); font-size: 13px; margin-bottom: 22px;}
  #login-box input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line);
    background: var(--bg-elev-2); color: var(--text); font-size: 14px; margin-bottom: 14px; outline:none;
  }
  #login-box input:focus{ border-color: var(--accent); }
  #login-box button{
    width:100%; padding:12px; border-radius:8px; border:none; background: var(--accent);
    color:#241a05; font-weight:600; font-size:14px; cursor:pointer;
  }
  #login-error{ color: var(--bad); font-size:12.5px; margin-top:10px; min-height:16px;}

  /* ---------- APP SHELL ---------- */
  #app{ display:none; min-height:100vh; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px; border-bottom:1px solid var(--line); background: var(--bg-elev);
  }
  header h1{ font-family: var(--font-head); font-size:19px; letter-spacing:0.3px; }
  header h1 span{ color: var(--accent); }

  nav{ display:flex; gap:6px; }
  nav button{
    background:none; border:1px solid transparent; color: var(--text-dim);
    padding:9px 16px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:500;
    transition: all .15s;
  }
  nav button:hover{ color: var(--text); }
  nav button.active{ background: var(--bg-elev-2); color: var(--text); border-color: var(--line); }

  main{ padding: 26px 28px 60px; max-width: 1400px; margin: 0 auto; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- shared bits ---------- */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .btn{
    padding:10px 16px; border-radius:8px; border:1px solid var(--line); background: var(--bg-elev-2);
    color: var(--text); font-size:13.5px; cursor:pointer; font-weight:500;
  }
  .btn:hover{ border-color: var(--accent); }
  .btn-primary{ background: var(--accent); color:#241a05; border-color: var(--accent); font-weight:600;}
  .btn-primary:hover{ opacity:0.92; }
  .btn-danger{ color: var(--bad); }

  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:0.2px;}
  .badge.motorista{ background: var(--c-motorista-bg); color: var(--c-motorista);}
  .badge.operador{ background: var(--c-operador-bg); color: var(--c-operador);}
  .badge.administrativo{ background: var(--c-administrativo-bg); color: var(--c-administrativo);}
  .badge.outros{ background: var(--c-outros-bg); color: var(--c-outros);}

  input[type=text], input[type=date], input[type=tel], input[type=email], textarea, select{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background: var(--bg-elev-2); color: var(--text); font-size:13.5px; outline:none; font-family: var(--font-body);
  }
  input:focus, textarea:focus, select:focus{ border-color: var(--accent); }
  label{ display:block; font-size:12px; color: var(--text-dim); margin-bottom:5px; margin-top:12px; font-weight:600;}
  textarea{ resize: vertical; min-height:70px;}

  /* ---------- KANBAN ---------- */
  .kanban{ display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; }
  .kcol{ background: var(--bg-elev); border:1px solid var(--line); border-radius: var(--radius); padding:14px; min-height:200px;}
  .kcol h3{ font-size:13px; color: var(--text-dim); margin-bottom:12px; display:flex; justify-content:space-between; text-transform:uppercase; letter-spacing:0.5px;}
  .kcol h3 em{ font-style:normal; background: var(--bg-elev-2); border-radius:20px; padding:1px 8px; font-size:11px;}
  .kcard{
    background: var(--bg-elev-2); border:1px solid var(--line); border-radius:10px; padding:12px;
    margin-bottom:10px; cursor:grab; transition: border-color .15s;
  }
  .kcard:hover{ border-color: var(--accent); }
  .kcard.dragging{ opacity:0.4; }
  .kcard h4{ font-size:13.5px; margin-bottom:7px; line-height:1.35;}
  .kcard .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:9px;}
  .kcard .prazo{ font-size:11px; color: var(--text-dim); font-family: var(--font-mono);}
  .kcard .prazo.overdue{ color: var(--bad); font-weight:600;}
  .kdrop{ min-height: 30px; }
  .kdrop.over{ background: var(--bg-elev-2); border-radius:8px; outline:1px dashed var(--accent);}

  /* ---------- CALENDÁRIO ---------- */
  .cal-header{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:18px;}
  .cal-header h2{ font-family: var(--font-head); font-size:18px; min-width:190px; text-align:center;}
  .cal-header button{ background: var(--bg-elev-2); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px;}
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:8px;}
  .cal-dow{ text-align:center; font-size:11px; color: var(--text-dim); text-transform:uppercase; padding-bottom:6px; letter-spacing:0.5px;}
  .cal-day{ background: var(--bg-elev); border:1px solid var(--line); border-radius:10px; min-height:96px; padding:8px; font-size:12px;}
  .cal-day.empty{ background:none; border:none;}
  .cal-day .num{ color: var(--text-dim); font-size:11px; margin-bottom:6px; font-family: var(--font-mono);}
  .cal-day.today{ border-color: var(--accent); }
  .cal-item{ font-size:10.5px; padding:3px 6px; border-radius:5px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}
  .cal-item.overdue{ background: #3d1f1c; color: var(--bad); }
  .cal-item.soon{ background: var(--c-operador-bg); color: var(--c-operador); }
  .cal-item.ok{ background: #1a3327; color: var(--good); }

  /* ---------- CURRÍCULOS ---------- */
  .filtros-tipo{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .filtro-chip{
    padding:8px 14px; border-radius:20px; border:1px solid var(--line); background: var(--bg-elev-2);
    color: var(--text-dim); font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .filtro-chip.active{ border-color: var(--accent); color: var(--accent); background: var(--accent-dim);}
  .search-row{ margin-bottom:18px; }
  .search-row input{ font-size:14px; padding:12px 14px; }

  .curriculo-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:14px;}
  .ccard{ background: var(--bg-elev); border:1px solid var(--line); border-radius: var(--radius); padding:16px;}
  .ccard .top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .ccard h4{ font-size:15px; margin-bottom:2px;}
  .ccard .cargo{ font-size:12px; color: var(--text-dim); }
  .ccard .info{ font-size:12.5px; color: var(--text-dim); margin-top:10px; line-height:1.7;}
  .ccard .info b{ color: var(--text); font-weight:500;}
  .ccard .actions{ display:flex; gap:8px; margin-top:12px; }
  .ccard .actions a, .ccard .actions button{
    flex:1; text-align:center; padding:7px; border-radius:7px; font-size:12px; text-decoration:none;
    background: var(--bg-elev-2); color: var(--text); border:1px solid var(--line); cursor:pointer;
  }
  .empty-state{ text-align:center; padding:60px 20px; color: var(--text-dim); }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background: rgba(10,9,14,0.7); z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.active{ display:flex; }
  .modal{
    background: var(--bg-elev); border:1px solid var(--line); border-radius: var(--radius);
    width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:26px;
  }
  .modal h2{ font-family: var(--font-head); font-size:17px; margin-bottom:4px;}
  .modal .close{ float:right; background:none; border:none; color: var(--text-dim); font-size:20px; cursor:pointer;}
  .modal-actions{ display:flex; gap:10px; margin-top:22px;}
  .modal-actions .btn{ flex:1;}
  .file-drop{
    border:1.5px dashed var(--line); border-radius:8px; padding:16px; text-align:center; font-size:12.5px;
    color: var(--text-dim); margin-top:12px; cursor:pointer;
  }
  .file-drop.has-file{ border-color: var(--good); color: var(--good);}

  @media (max-width: 900px){
    .kanban{ grid-template-columns: 1fr 1fr; }
    header{ flex-direction:column; align-items:flex-start; gap:12px;}
  }
  @media (max-width: 560px){
    .kanban{ grid-template-columns: 1fr; }
    .cal-grid{ grid-template-columns: repeat(7, minmax(38px,1fr)); }
    .cal-day{ min-height:60px; padding:4px; font-size:10px;}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Painel de <span>RH</span></h1>
    <p>Digite a senha de acesso</p>
    <input type="password" id="login-pass" placeholder="Senha" />
    <button onclick="tentarLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Painel de <span>RH</span></h1>
    <nav>
      <button class="active" data-view="demandas" onclick="trocarView('demandas')">Demandas</button>
      <button data-view="calendario" onclick="trocarView('calendario')">Calendário</button>
      <button data-view="curriculos" onclick="trocarView('curriculos')">Banco de Currículos</button>
    </nav>
  </header>

  <main>

    <!-- ===================== VIEW: DEMANDAS ===================== -->
    <section id="view-demandas" class="view active">
      <div class="toolbar">
        <div style="color:var(--text-dim); font-size:13px;">Vagas e demandas de contratação, organizadas por status</div>
        <button class="btn btn-primary" onclick="abrirModalDemanda()">+ Nova demanda</button>
      </div>
      <div class="kanban" id="kanban"></div>
    </section>

    <!-- ===================== VIEW: CALENDÁRIO ===================== -->
    <section id="view-calendario" class="view">
      <div class="cal-header">
        <button onclick="mudarMes(-1)">‹</button>
        <h2 id="cal-titulo"></h2>
        <button onclick="mudarMes(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-dow-row"></div>
      <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
    </section>

    <!-- ===================== VIEW: CURRÍCULOS ===================== -->
    <section id="view-curriculos" class="view">
      <div class="toolbar">
        <div style="color:var(--text-dim); font-size:13px;">Banco de candidatos, separado por área</div>
        <button class="btn btn-primary" onclick="abrirModalCurriculo()">+ Novo currículo</button>
      </div>
      <div class="search-row">
        <input type="text" id="busca-curriculo" placeholder="Buscar por nome, cargo, telefone ou e-mail..." oninput="renderCurriculos()" />
      </div>
      <div class="filtros-tipo" id="filtros-tipo"></div>
      <div class="curriculo-grid" id="curriculo-grid"></div>
    </section>

  </main>
</div>

<!-- ===================== MODAL: DEMANDA ===================== -->
<div class="modal-overlay" id="modal-demanda">
  <div class="modal">
    <button class="close" onclick="fecharModais()">×</button>
    <h2 id="modal-demanda-titulo">Nova demanda</h2>
    <input type="hidden" id="d-id" />

    <label>Título da demanda</label>
    <input type="text" id="d-titulo" placeholder="Ex: Contratar motorista para rota Norte" />

    <label>Área</label>
    <select id="d-tipo">
      <option value="motorista">Motorista</option>
      <option value="operador">Operador</option>
      <option value="administrativo">Administrativo</option>
      <option value="outros">Outros</option>
    </select>

    <label>Status</label>
    <select id="d-status">
      <option value="Fila">Fila</option>
      <option value="Em andamento">Em andamento</option>
      <option value="Revisão">Revisão</option>
      <option value="Concluído">Concluído</option>
    </select>

    <label>Prazo</label>
    <input type="date" id="d-prazo" />

    <label>Responsável</label>
    <input type="text" id="d-responsavel" placeholder="Quem está cuidando dessa demanda" />

    <label>Descrição</label>
    <textarea id="d-descricao" placeholder="Detalhes da vaga, requisitos, observações..."></textarea>

    <div class="modal-actions">
      <button class="btn btn-danger" id="d-btn-excluir" onclick="excluirDemanda()" style="display:none;">Excluir</button>
      <button class="btn btn-primary" onclick="salvarDemanda()">Salvar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: CURRÍCULO ===================== -->
<div class="modal-overlay" id="modal-curriculo">
  <div class="modal">
    <button class="close" onclick="fecharModais()">×</button>
    <h2 id="modal-curriculo-titulo">Novo currículo</h2>
    <input type="hidden" id="c-id" />

    <label>Nome completo</label>
    <input type="text" id="c-nome" placeholder="Nome do candidato" />

    <label>Área</label>
    <select id="c-tipo">
      <option value="motorista">Motorista</option>
      <option value="operador">Operador</option>
      <option value="administrativo">Administrativo</option>
      <option value="outros">Outros</option>
    </select>

    <label>Cargo pretendido</label>
    <input type="text" id="c-cargo" placeholder="Ex: Motorista categoria D" />

    <label>Telefone</label>
    <input type="tel" id="c-telefone" placeholder="(00) 00000-0000" />

    <label>E-mail</label>
    <input type="email" id="c-email" placeholder="email@exemplo.com" />

    <label>Experiência / resumo</label>
    <textarea id="c-experiencia" placeholder="Resumo rápido da experiência do candidato"></textarea>

    <label>Observações</label>
    <textarea id="c-observacoes" placeholder="Observações internas (opcional)"></textarea>

    <label>Currículo (PDF ou imagem)</label>
    <div class="file-drop" id="file-drop" onclick="document.getElementById('c-arquivo').click()">
      Clique para escolher o arquivo
    </div>
    <input type="file" id="c-arquivo" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="onArquivoSelecionado()" />

    <div class="modal-actions">
      <button class="btn btn-danger" id="c-btn-excluir" onclick="excluirCurriculo()" style="display:none;">Excluir</button>
      <button class="btn btn-primary" onclick="salvarCurriculo()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ======================= CONFIG =======================
const API_URL = 'https://script.google.com/macros/s/AKfycbxjNXWF-uk1bNMw0hdwxox6YrJmzuvfrkP2m9vRbbMxK6dXAcD3IDlAVK2SnWO8CCaZoQ/exec';
const SENHA_ACESSO = '1996'; // troque se quiser

const STATUS_COLS = ['Fila', 'Em andamento', 'Revisão', 'Concluído'];
const TIPOS = [
  { id: 'motorista', label: 'Motorista' },
  { id: 'operador', label: 'Operador' },
  { id: 'administrativo', label: 'Administrativo' },
  { id: 'outros', label: 'Outros' }
];

let demandas = [];
let curriculos = [];
let filtroTipoAtivo = 'todos';
let calMesAtual = new Date().getMonth();
let calAnoAtual = new Date().getFullYear();
let arquivoBase64 = null;
let arquivoNome = null;
let arquivoMime = null;

// ======================= LOGIN =======================
function tentarLogin(){
  const val = document.getElementById('login-pass').value;
  if (val === SENHA_ACESSO){
    sessionStorage.setItem('acesso_rh', 'ok');
    iniciarApp();
  } else {
    document.getElementById('login-error').textContent = 'Senha incorreta.';
  }
}
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key === 'Enter') tentarLogin(); });

if (sessionStorage.getItem('acesso_rh') === 'ok'){
  iniciarApp();
}

function iniciarApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  carregarTudo();
}

// ======================= API =======================
async function apiGet(action){
  const res = await fetch(`${API_URL}?action=${action}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

async function carregarTudo(){
  try{
    demandas = await apiGet('listDemandas');
  } catch(e){ demandas = []; console.error('Erro ao carregar demandas', e); }
  try{
    curriculos = await apiGet('listCurriculos');
  } catch(e){ curriculos = []; console.error('Erro ao carregar currículos', e); }
  renderKanban();
  renderCalendario();
  renderFiltrosTipo();
  renderCurriculos();
}

// ======================= NAVEGAÇÃO =======================
function trocarView(nome){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === nome));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + nome).classList.add('active');
}

function fecharModais(){
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
  arquivoBase64 = null; arquivoNome = null; arquivoMime = null;
}

function tipoLabel(id){
  const t = TIPOS.find(t => t.id === id);
  return t ? t.label : id;
}

// ======================= KANBAN (DEMANDAS) =======================
function renderKanban(){
  const kanban = document.getElementById('kanban');
  kanban.innerHTML = '';
  STATUS_COLS.forEach(status => {
    const itens = demandas.filter(d => d.status === status);
    const col = document.createElement('div');
    col.className = 'kcol';
    col.innerHTML = `<h3>${status} <em>${itens.length}</em></h3><div class="kdrop" data-status="${status}"></div>`;
    kanban.appendChild(col);

    const drop = col.querySelector('.kdrop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      moverDemanda(id, status);
    });

    itens.forEach(d => {
      const card = document.createElement('div');
      card.className = 'kcard';
      card.draggable = true;
      card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', d.id); card.classList.add('dragging'); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.onclick = () => abrirModalDemanda(d);

      const hoje = new Date().toISOString().slice(0,10);
      const atrasado = d.prazo && d.prazo < hoje && status !== 'Concluído';

      card.innerHTML = `
        <span class="badge ${d.tipo}">${tipoLabel(d.tipo)}</span>
        <h4 style="margin-top:8px;">${d.titulo || '(sem título)'}</h4>
        <div class="meta">
          <span class="prazo ${atrasado ? 'overdue' : ''}">${d.prazo ? formatarData(d.prazo) : 'sem prazo'}</span>
          <span style="font-size:11px; color:var(--text-dim);">${d.responsavel || ''}</span>
        </div>`;
      drop.appendChild(card);
    });
  });
}

async function moverDemanda(id, novoStatus){
  const d = demandas.find(x => String(x.id) === String(id));
  if (!d || d.status === novoStatus) return;
  d.status = novoStatus;
  renderKanban();
  try{ await apiPost({ action: 'saveDemanda', demanda: d }); } catch(e){ alert('Erro ao salvar: ' + e.message); }
  renderCalendario();
}

function abrirModalDemanda(d){
  document.getElementById('modal-demanda-titulo').textContent = d ? 'Editar demanda' : 'Nova demanda';
  document.getElementById('d-id').value = d ? d.id : '';
  document.getElementById('d-titulo').value = d ? d.titulo : '';
  document.getElementById('d-tipo').value = d ? d.tipo : 'motorista';
  document.getElementById('d-status').value = d ? d.status : 'Fila';
  document.getElementById('d-prazo').value = d ? d.prazo : '';
  document.getElementById('d-responsavel').value = d ? d.responsavel : '';
  document.getElementById('d-descricao').value = d ? d.descricao : '';
  document.getElementById('d-btn-excluir').style.display = d ? 'block' : 'none';
  document.getElementById('modal-demanda').classList.add('active');
}

async function salvarDemanda(){
  const d = {
    id: document.getElementById('d-id').value || null,
    titulo: document.getElementById('d-titulo').value.trim(),
    tipo: document.getElementById('d-tipo').value,
    status: document.getElementById('d-status').value,
    prazo: document.getElementById('d-prazo').value,
    responsavel: document.getElementById('d-responsavel').value.trim(),
    descricao: document.getElementById('d-descricao').value.trim()
  };
  if (!d.titulo){ alert('Dá um título pra essa demanda.'); return; }
  try{
    const salvo = await apiPost({ action: 'saveDemanda', demanda: d });
    const idx = demandas.findIndex(x => String(x.id) === String(salvo.id));
    if (idx >= 0) demandas[idx] = salvo; else demandas.push(salvo);
    fecharModais();
    renderKanban();
    renderCalendario();
  } catch(e){ alert('Erro ao salvar: ' + e.message); }
}

async function excluirDemanda(){
  const id = document.getElementById('d-id').value;
  if (!id || !confirm('Excluir essa demanda?')) return;
  try{
    await apiPost({ action: 'deleteDemanda', id });
    demandas = demandas.filter(x => String(x.id) !== String(id));
    fecharModais();
    renderKanban();
    renderCalendario();
  } catch(e){ alert('Erro ao excluir: ' + e.message); }
}

// ======================= CALENDÁRIO =======================
function renderCalendario(){
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-titulo').textContent = `${meses[calMesAtual]} de ${calAnoAtual}`;

  const dowRow = document.getElementById('cal-dow-row');
  dowRow.innerHTML = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d => `<div class="cal-dow">${d}</div>`).join('');

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const primeiroDia = new Date(calAnoAtual, calMesAtual, 1).getDay();
  const totalDias = new Date(calAnoAtual, calMesAtual + 1, 0).getDate();
  const hojeStr = new Date().toISOString().slice(0,10);

  for (let i = 0; i < primeiroDia; i++){
    grid.innerHTML += `<div class="cal-day empty"></div>`;
  }

  for (let dia = 1; dia <= totalDias; dia++){
    const dataStr = `${calAnoAtual}-${String(calMesAtual+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const itensDoDia = demandas.filter(d => d.prazo === dataStr);
    const isToday = dataStr === hojeStr;

    let itensHtml = itensDoDia.map(d => {
      let classe = 'ok';
      const diff = (new Date(dataStr) - new Date(hojeStr)) / 86400000;
      if (d.status !== 'Concluído' && diff < 0) classe = 'overdue';
      else if (d.status !== 'Concluído' && diff <= 3) classe = 'soon';
      return `<div class="cal-item ${classe}" title="${d.titulo}">${d.titulo}</div>`;
    }).join('');

    grid.innerHTML += `<div class="cal-day ${isToday ? 'today' : ''}"><div class="num">${dia}</div>${itensHtml}</div>`;
  }
}

function mudarMes(delta){
  calMesAtual += delta;
  if (calMesAtual > 11){ calMesAtual = 0; calAnoAtual++; }
  if (calMesAtual < 0){ calMesAtual = 11; calAnoAtual--; }
  renderCalendario();
}

function formatarData(iso){
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// ======================= CURRÍCULOS =======================
function renderFiltrosTipo(){
  const container = document.getElementById('filtros-tipo');
  const todosChip = `<div class="filtro-chip ${filtroTipoAtivo==='todos'?'active':''}" onclick="setFiltroTipo('todos')">Todos (${curriculos.length})</div>`;
  const chips = TIPOS.map(t => {
    const qtd = curriculos.filter(c => c.tipo === t.id).length;
    return `<div class="filtro-chip ${filtroTipoAtivo===t.id?'active':''}" onclick="setFiltroTipo('${t.id}')">${t.label} (${qtd})</div>`;
  }).join('');
  container.innerHTML = todosChip + chips;
}

function setFiltroTipo(tipo){
  filtroTipoAtivo = tipo;
  renderFiltrosTipo();
  renderCurriculos();
}

function renderCurriculos(){
  const busca = document.getElementById('busca-curriculo').value.toLowerCase().trim();
  let lista = curriculos.filter(c => filtroTipoAtivo === 'todos' || c.tipo === filtroTipoAtivo);
  if (busca){
    lista = lista.filter(c =>
      (c.nome||'').toLowerCase().includes(busca) ||
      (c.cargoPretendido||'').toLowerCase().includes(busca) ||
      (c.telefone||'').toLowerCase().includes(busca) ||
      (c.email||'').toLowerCase().includes(busca)
    );
  }

  const grid = document.getElementById('curriculo-grid');
  if (lista.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Nenhum currículo encontrado.</div>`;
    return;
  }

  grid.innerHTML = lista.map(c => `
    <div class="ccard">
      <div class="top">
        <div>
          <h4>${c.nome}</h4>
          <div class="cargo">${c.cargoPretendido || ''}</div>
        </div>
        <span class="badge ${c.tipo}">${tipoLabel(c.tipo)}</span>
      </div>
      <div class="info">
        ${c.telefone ? `<div><b>Tel:</b> ${c.telefone}</div>` : ''}
        ${c.email ? `<div><b>E-mail:</b> ${c.email}</div>` : ''}
        ${c.experiencia ? `<div style="margin-top:6px;">${c.experiencia}</div>` : ''}
      </div>
      <div class="actions">
        ${c.arquivoUrl ? `<a href="${c.arquivoUrl}" target="_blank">Ver currículo</a>` : ''}
        <button onclick='abrirModalCurriculo(${JSON.stringify(c).replace(/'/g,"&apos;")})'>Editar</button>
      </div>
    </div>
  `).join('');
}

function abrirModalCurriculo(c){
  document.getElementById('modal-curriculo-titulo').textContent = c ? 'Editar currículo' : 'Novo currículo';
  document.getElementById('c-id').value = c ? c.id : '';
  document.getElementById('c-nome').value = c ? c.nome : '';
  document.getElementById('c-tipo').value = c ? c.tipo : 'motorista';
  document.getElementById('c-cargo').value = c ? c.cargoPretendido : '';
  document.getElementById('c-telefone').value = c ? c.telefone : '';
  document.getElementById('c-email').value = c ? c.email : '';
  document.getElementById('c-experiencia').value = c ? c.experiencia : '';
  document.getElementById('c-observacoes').value = c ? c.observacoes : '';
  document.getElementById('c-btn-excluir').style.display = c ? 'block' : 'none';

  const fileDrop = document.getElementById('file-drop');
  if (c && c.arquivoNome){
    fileDrop.textContent = `Arquivo atual: ${c.arquivoNome} (clique para trocar)`;
    fileDrop.classList.add('has-file');
  } else {
    fileDrop.textContent = 'Clique para escolher o arquivo';
    fileDrop.classList.remove('has-file');
  }
  arquivoBase64 = null; arquivoNome = null; arquivoMime = null;
  document.getElementById('c-arquivo').value = '';

  document.getElementById('modal-curriculo').classList.add('active');
}

function onArquivoSelecionado(){
  const input = document.getElementById('c-arquivo');
  const file = input.files[0];
  if (!file) return;
  arquivoNome = file.name;
  arquivoMime = file.type || 'application/octet-stream';
  const reader = new FileReader();
  reader.onload = () => {
    arquivoBase64 = reader.result.split(',')[1];
    const fileDrop = document.getElementById('file-drop');
    fileDrop.textContent = `Selecionado: ${arquivoNome}`;
    fileDrop.classList.add('has-file');
  };
  reader.readAsDataURL(file);
}

async function salvarCurriculo(){
  const c = {
    id: document.getElementById('c-id').value || null,
    nome: document.getElementById('c-nome').value.trim(),
    tipo: document.getElementById('c-tipo').value,
    cargoPretendido: document.getElementById('c-cargo').value.trim(),
    telefone: document.getElementById('c-telefone').value.trim(),
    email: document.getElementById('c-email').value.trim(),
    experiencia: document.getElementById('c-experiencia').value.trim(),
    observacoes: document.getElementById('c-observacoes').value.trim()
  };
  if (!c.nome){ alert('Dá o nome do candidato.'); return; }

  try{
    if (arquivoBase64){
      const up = await apiPost({ action: 'uploadArquivo', nomeArquivo: arquivoNome, mimeType: arquivoMime, base64: arquivoBase64 });
      c.arquivoUrl = up.url;
      c.arquivoNome = up.nome;
    }
    const salvo = await apiPost({ action: 'saveCurriculo', curriculo: c });
    const idx = curriculos.findIndex(x => String(x.id) === String(salvo.id));
    if (idx >= 0) curriculos[idx] = salvo; else curriculos.push(salvo);
    fecharModais();
    renderFiltrosTipo();
    renderCurriculos();
  } catch(e){ alert('Erro ao salvar: ' + e.message); }
}

async function excluirCurriculo(){
  const id = document.getElementById('c-id').value;
  if (!id || !confirm('Excluir esse currículo?')) return;
  try{
    await apiPost({ action: 'deleteCurriculo', id });
    curriculos = curriculos.filter(x => String(x.id) !== String(id));
    fecharModais();
    renderFiltrosTipo();
    renderCurriculos();
  } catch(e){ alert('Erro ao excluir: ' + e.message); }
}
